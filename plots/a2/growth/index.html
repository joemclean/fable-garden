<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trust the Feeling</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0c10; color: #cfd6e4;
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: block; }
  #hud {
    position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0;
    text-align: center; pointer-events: none;
    padding-top: 14px;
  }
  #score { font-size: 28px; letter-spacing: 2px; color: #e8ecf4; }
  #streak { font-size: 13px; letter-spacing: 3px; color: #6d7789; margin-top: 2px;
    text-transform: uppercase; min-height: 16px; }
  #mult {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    text-align: center; pointer-events: none;
    font-size: 15px; letter-spacing: 2px; color: #8a93a6;
    opacity: 0; transition: opacity .3s;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    background: #0a0c10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 32px; cursor: pointer;
    transition: opacity .8s ease;
  }
  #overlay.gone { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-size: 30px; font-weight: normal; letter-spacing: 1px; color: #e8ecf4;
    margin: 0 0 18px;
  }
  #overlay p { font-size: 16px; line-height: 1.7; color: #8a93a6; margin: 0 0 10px; max-width: 34ch; }
  #overlay .go {
    margin-top: 36px; font-size: 14px; letter-spacing: 4px; text-transform: uppercase;
    color: #cfd6e4; border: 1px solid #2a3140; border-radius: 999px;
    padding: 12px 28px;
    animation: breathe 3s ease-in-out infinite;
  }
  #overlay .hp { margin-top: 20px; font-size: 12px; color: #4d5566; letter-spacing: 1px; }
  @keyframes breathe { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
  #back {
    position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    z-index: 11; font-size: 12px; letter-spacing: 2px;
    color: #3d4556; text-decoration: none; opacity: .8;
  }
  #back:hover { color: #8a93a6; }
  #reveal {
    position: fixed; inset: 0; z-index: 9;
    background: rgba(10,12,16,0.94);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 32px;
    opacity: 0; pointer-events: none; transition: opacity .9s ease;
  }
  #reveal.on { opacity: 1; pointer-events: auto; }
  #reveal .rv-title {
    font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
    color: #6d7789; margin-bottom: 30px;
  }
  #reveal .rv-line { font-size: 18px; line-height: 1.6; color: #cfd6e4; margin: 10px 0; }
  #reveal .rv-line .n { color: #ebd7a0; }
  #reveal .rv-bar {
    width: 180px; height: 3px; margin: 6px auto 18px;
    background: #1a1f2a; border-radius: 2px; overflow: hidden;
  }
  #reveal .rv-bar i { display: block; height: 100%; background: #ebd7a0; opacity: .7; }
  #reveal .go2 {
    margin-top: 40px; font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
    color: #6d7789; animation: breathe 3s ease-in-out infinite;
  }
</style>

<canvas id="stage"></canvas>
<div id="hud">
  <div id="score">0</div>
  <div id="streak"></div>
</div>
<div id="mult"></div>
<div id="overlay">
  <h1>Trust the Feeling</h1>
  <p>Something is hidden on this page. You will not see it.</p>
  <p>Hold your finger down and wander. Let go where it feels right &mdash; before you're sure.</p>
  <div class="go">touch to begin</div>
  <div class="hp">sound on &middot; headphones help</div>
</div>
<div id="reveal">
  <div class="rv-title">a breath, before going on</div>
  <div id="rv-body"></div>
  <div class="go2">touch to continue</div>
</div>
<a id="back" href="../../../viewer/">garden</a>

<script>
'use strict';

// ---------- canvas ----------
const cv = document.getElementById('stage');
const cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- state ----------
const HOLD_SECONDS = 6;      // multiplier drains over this long
const MULT_MAX = 5, MULT_MIN = 1;
let target = null;           // {x, y}
let hitRadius = 0;
let holding = false;
let holdStart = 0;
let finger = { x: 0, y: 0 };
let score = 0, streak = 0;
let best = parseInt(localStorage.getItem('a2-best') || '0', 10) || 0;
let resting = false;         // brief pause after a commit
let revealing = false;       // the hesitation mirror is up
let commits = [];            // {held, hit} — the player's own hesitation curve
let effects = [];            // transient rings / blooms
let audioReady = false;
const EARLY_S = 2.2;         // letting go before this counts as trusting early

const scoreEl = document.getElementById('score');
const streakEl = document.getElementById('streak');
const multEl = document.getElementById('mult');

function newRound() {
  const m = 0.16; // keep target away from edges
  target = {
    x: (m + Math.random() * (1 - 2 * m)) * W,
    y: (m + Math.random() * (1 - 2 * m)) * H
  };
  // trust has to deepen: the mark tightens as the streak grows
  hitRadius = Math.min(W, H) * 0.15 * (1 - Math.min(streak, 6) * 0.06);
  resting = false;
}

function signalFade() {
  // the cue recedes as you prove trustworthy; a miss brings it back
  return 1 - Math.min(streak, 6) * 0.075;
}

function nearness(x, y) {
  // 1 at the target, 0 at the far end of the screen
  const d = Math.hypot(x - target.x, y - target.y);
  const span = Math.hypot(W, H) * 0.6;
  return Math.max(0, 1 - d / span);
}

function currentMult() {
  const t = Math.min(1, (performance.now() - holdStart) / (HOLD_SECONDS * 1000));
  return MULT_MAX - (MULT_MAX - MULT_MIN) * t;
}

// ---------- audio: the whole mechanism ----------
// A quiet drone of two near-unison sines. Far from the target they beat
// against each other; near it the beating stills. A faint high shimmer
// and a breath of filtered noise lean the same way. All of it sits just
// under the level where you could point at what changed.
let AC, master, oscA, oscB, shimmer, shimGain, noiseSrc, noiseFilter, noiseGain, droneGain;

function makeNoiseBuffer(ac) {
  const len = ac.sampleRate * 2;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  return buf;
}

function initAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);

  droneGain = AC.createGain(); droneGain.gain.value = 0; droneGain.connect(master);
  oscA = AC.createOscillator(); oscA.type = 'sine'; oscA.frequency.value = 108;
  oscB = AC.createOscillator(); oscB.type = 'sine'; oscB.frequency.value = 112.5;
  const gA = AC.createGain(), gB = AC.createGain();
  gA.gain.value = 0.5; gB.gain.value = 0.5;
  oscA.connect(gA).connect(droneGain);
  oscB.connect(gB).connect(droneGain);
  oscA.start(); oscB.start();

  shimmer = AC.createOscillator(); shimmer.type = 'sine'; shimmer.frequency.value = 648;
  shimGain = AC.createGain(); shimGain.gain.value = 0;
  shimmer.connect(shimGain).connect(master);
  shimmer.start();

  noiseSrc = AC.createBufferSource();
  noiseSrc.buffer = makeNoiseBuffer(AC);
  noiseSrc.loop = true;
  noiseFilter = AC.createBiquadFilter();
  noiseFilter.type = 'lowpass'; noiseFilter.frequency.value = 300; noiseFilter.Q.value = 0.7;
  noiseGain = AC.createGain(); noiseGain.gain.value = 0;
  noiseSrc.connect(noiseFilter).connect(noiseGain).connect(master);
  noiseSrc.start();

  audioReady = true;
}

function audioListen(on) {
  if (!audioReady) return;
  const t = AC.currentTime;
  droneGain.gain.setTargetAtTime(on ? 0.085 * signalFade() : 0, t, on ? 0.15 : 0.25);
  noiseGain.gain.setTargetAtTime(on ? 0.018 : 0, t, on ? 0.3 : 0.25);
  if (!on) shimGain.gain.setTargetAtTime(0, t, 0.15);
}

function audioTrack(n) {
  // n = nearness 0..1. The signal, quietly.
  if (!audioReady) return;
  const t = AC.currentTime;
  const beat = 0.15 + (1 - n) * (1 - n) * 5.2;   // Hz of beating: ~5.4 far, ~0.15 at target
  oscB.frequency.setTargetAtTime(108 + beat, t, 0.12);
  shimGain.gain.setTargetAtTime(Math.pow(n, 3) * 0.045 * signalFade(), t, 0.2);
  noiseFilter.frequency.setTargetAtTime(300 + n * n * 1100, t, 0.2);
}

function chime(step) {
  // soft pentatonic pluck, rising with the streak
  if (!audioReady) return;
  const scale = [0, 2, 4, 7, 9];
  const semis = scale[step % 5] + 12 * Math.floor(step / 5);
  const f = 432 * Math.pow(2, Math.min(semis, 24) / 12);
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.16, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 1.5);
}

function thud() {
  if (!audioReady) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(90, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.3);
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.12, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 0.6);
}

// ---------- input ----------
const overlay = document.getElementById('overlay');
let started = false;

function begin() {
  if (started) return;
  started = true;
  initAudio();
  if (AC.state === 'suspended') AC.resume();
  overlay.classList.add('gone');
  newRound();
}
overlay.addEventListener('pointerdown', begin);

function pointerPos(e) { return { x: e.clientX, y: e.clientY }; }

window.addEventListener('pointerdown', e => {
  if (!started || resting || holding || revealing) return;
  if (e.target.id === 'back' || overlay.contains(e.target)) return;
  holding = true;
  holdStart = performance.now();
  finger = pointerPos(e);
  audioListen(true);
  audioTrack(nearness(finger.x, finger.y));
  multEl.style.opacity = 1;
});

window.addEventListener('pointermove', e => {
  if (!holding) return;
  finger = pointerPos(e);
  audioTrack(nearness(finger.x, finger.y));
});

function endHold(e) {
  if (!holding) return;
  holding = false;
  if (e && e.clientX !== undefined) finger = pointerPos(e);
  audioListen(false);
  multEl.style.opacity = 0;
  commit(finger.x, finger.y);
}
window.addEventListener('pointerup', endHold);
window.addEventListener('pointercancel', endHold);

// ---------- commit ----------
function commit(x, y) {
  resting = true;
  const d = Math.hypot(x - target.x, y - target.y);
  const mult = currentMult();
  const held = (performance.now() - holdStart) / 1000;
  const hit = d <= hitRadius;
  commits.push({ held, hit });
  if (hit) {
    const pts = Math.round(100 * mult);
    score += pts; streak += 1;
    if (streak > best) { best = streak; localStorage.setItem('a2-best', best); }
    chime(streak - 1);
    effects.push({ kind: 'bloom', x, y, t0: performance.now(), pts });
  } else {
    streak = 0;
    thud();
    effects.push({ kind: 'miss', x, y, t0: performance.now() });
    // show where it truly was, briefly — what happened, never why
    effects.push({ kind: 'ghost', x: target.x, y: target.y, t0: performance.now() });
  }
  scoreEl.textContent = score;
  streakEl.textContent = streak >= 2 ? streak + ' in a row' : (best >= 3 && streak === 0 ? 'best ' + best : '');
  if (commits.length % 9 === 0) setTimeout(showReveal, 1300);
  else setTimeout(newRound, 1100);
}

// ---------- the hesitation mirror ----------
// Every nine commits, show the player their own curve: how often they
// were right when they let go early, how often when they waited.
// Numbers only. What happened, never why.
const revealEl = document.getElementById('reveal');
const rvBody = document.getElementById('rv-body');

function showReveal() {
  const nine = commits.slice(-9);
  const early = nine.filter(c => c.held < EARLY_S);
  const late = nine.filter(c => c.held >= EARLY_S);
  const row = (label, arr) => {
    if (!arr.length) return '<div class="rv-line">' + label + ' &mdash; you never did</div>';
    const h = arr.filter(c => c.hit).length;
    return '<div class="rv-line">' + label + ' &mdash; right <span class="n">' + h +
      ' of ' + arr.length + '</span></div>' +
      '<div class="rv-bar"><i style="width:' + Math.round(100 * h / arr.length) + '%"></i></div>';
  };
  rvBody.innerHTML =
    row('when you let go early', early) +
    row('when you waited to be sure', late);
  revealing = true;
  revealEl.classList.add('on');
}

revealEl.addEventListener('pointerdown', () => {
  if (!revealing) return;
  revealEl.classList.remove('on');
  setTimeout(() => { revealing = false; newRound(); }, 450);
});

// ---------- drawing ----------
// The dust is scenery. It knows nothing.
const dust = [];
for (let i = 0; i < 42; i++) {
  dust.push({
    x: Math.random(), y: Math.random(),
    r: 0.6 + Math.random() * 1.4,
    vx: (Math.random() - 0.5) * 0.00007,
    vy: (Math.random() - 0.5) * 0.00007,
    a: 0.04 + Math.random() * 0.1,
    ph: Math.random() * Math.PI * 2
  });
}

function draw(now) {
  cx.clearRect(0, 0, W, H);

  // dust
  for (const p of dust) {
    p.x = (p.x + p.vx + 1) % 1;
    p.y = (p.y + p.vy + 1) % 1;
    const tw = 0.75 + 0.25 * Math.sin(now * 0.0006 + p.ph);
    cx.beginPath();
    cx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
    cx.fillStyle = 'rgba(180,195,220,' + (p.a * tw) + ')';
    cx.fill();
  }

  // finger acknowledgement (carries no information)
  if (holding) {
    const g = cx.createRadialGradient(finger.x, finger.y, 0, finger.x, finger.y, 46);
    g.addColorStop(0, 'rgba(160,175,205,0.10)');
    g.addColorStop(1, 'rgba(160,175,205,0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(finger.x, finger.y, 46, 0, Math.PI * 2); cx.fill();

    multEl.textContent = '×' + currentMult().toFixed(1);
  }

  // effects
  effects = effects.filter(fx => {
    const t = (now - fx.t0) / 1000;
    if (fx.kind === 'bloom') {
      if (t > 1.4) return false;
      const k = t / 1.4;
      for (let i = 0; i < 3; i++) {
        const kk = Math.max(0, k - i * 0.12);
        cx.beginPath();
        cx.arc(fx.x, fx.y, 10 + kk * 130, 0, Math.PI * 2);
        cx.strokeStyle = 'rgba(235,215,160,' + (0.5 * (1 - kk)) + ')';
        cx.lineWidth = 1.5;
        cx.stroke();
      }
      if (t < 1.1) {
        cx.font = '17px Georgia, serif';
        cx.textAlign = 'center';
        cx.fillStyle = 'rgba(235,215,160,' + (1 - t / 1.1) + ')';
        cx.fillText('+' + fx.pts, fx.x, fx.y - 30 - t * 22);
      }
      return true;
    }
    if (fx.kind === 'miss') {
      if (t > 0.7) return false;
      const k = t / 0.7;
      cx.beginPath();
      cx.arc(fx.x, fx.y, 8 + k * 34, 0, Math.PI * 2);
      cx.strokeStyle = 'rgba(120,130,150,' + (0.35 * (1 - k)) + ')';
      cx.lineWidth = 1;
      cx.stroke();
      return true;
    }
    if (fx.kind === 'ghost') {
      if (t > 0.9) return false;
      const a = t < 0.2 ? t / 0.2 : 1 - (t - 0.2) / 0.7;
      const g = cx.createRadialGradient(fx.x, fx.y, 0, fx.x, fx.y, hitRadius);
      g.addColorStop(0, 'rgba(200,210,235,' + (0.16 * a) + ')');
      g.addColorStop(1, 'rgba(200,210,235,0)');
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(fx.x, fx.y, hitRadius, 0, Math.PI * 2); cx.fill();
      return true;
    }
    return false;
  });

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
