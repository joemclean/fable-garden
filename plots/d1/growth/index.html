<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Seeing With Your Ears</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { font-family: Georgia, 'Times New Roman', serif; color: #cfcabe;
         -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; display: block; }
  #home { position: fixed; top: 10px; left: 12px; z-index: 30;
          color: #cfcabe; opacity: .22; font-size: 13px; text-decoration: none; }
  #home:hover { opacity: .6; }
  #veil { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
          align-items: center; justify-content: center; text-align: center;
          background: #000; transition: opacity 1.6s ease; padding: 0 2em; }
  #veil.gone { opacity: 0; pointer-events: none; }
  #veil h1 { font-weight: normal; font-size: 21px; letter-spacing: .14em;
             color: #a9a294; margin: 0 0 .9em; }
  #veil p { font-size: 15px; line-height: 1.7; color: #6f6a60; margin: .2em 0; }
  #hint { position: fixed; left: 0; right: 0; bottom: 14vh; z-index: 10;
          text-align: center; font-size: 15px; color: #59544b;
          opacity: 0; transition: opacity 2s ease; pointer-events: none; }
</style>

<canvas id="cv"></canvas>
<a id="home" href="../../../viewer/">&larr; the garden</a>

<div id="veil">
  <h1>seeing with your ears</h1>
  <p>the room is dark. something in it is humming.</p>
  <p>headphones on &mdash; then touch, and listen.</p>
</div>
<div id="hint">drag to drift toward the sound</div>

<script>
'use strict';

// ---------- world state (normalized 0..1 coords, converted per frame) ----------
const S = {
  started: false,
  round: 1,
  player: { x: 0.5, y: 0.78, vx: 0, vy: 0 },
  target: null,          // {x,y,drift}
  twin: null,            // false target, rough-voiced (later rounds)
  hazards: [],           // [{x,y}]
  stars: [],             // [{x,y,born}] one per catch, permanent
  stun: 0,               // seconds of knockback remaining
  glow: null,            // {x,y,t} catch ripple
  lastStep: 0,
  lastPing: -9999,       // ms timestamp of last sonar tap
  pinged: false,         // has the player ever pinged?
  ripple: null,          // {t} faint outgoing ping ring
  walls: [],             // interior walls [{x1,y1,x2,y2}] — matter you can't cross
  wallFlashes: [],       // [{w,at}] one-breath glints timed to each wall's echo
  lastWallHit: 0,        // ms of last soft knock against a wall
};

// stars persist across visits: the constellation is the plot's memory
function loadStars() {
  try {
    const raw = localStorage.getItem('d1-stars');
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return;
    const born = performance.now() - 60000; // old stars render at their floor glow
    for (const s of arr.slice(-240)) {
      if (typeof s.x === 'number' && typeof s.y === 'number')
        S.stars.push({ x: s.x, y: s.y, born });
    }
  } catch (e) {}
}
function saveStars() {
  try {
    localStorage.setItem('d1-stars',
      JSON.stringify(S.stars.slice(-240).map(s => ({ x: s.x, y: s.y }))));
  } catch (e) {}
}
loadStars();

const cv = document.getElementById('cv');
const g2 = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, MIN = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  MIN = Math.min(W, H);
  cv.width = W * DPR; cv.height = H * DPR;
  g2.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const px = p => ({ x: p.x * W, y: p.y * H });
const dist = (a, b) => Math.hypot((a.x - b.x) * W, (a.y - b.y) * H);
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);

// ---------- interior walls: matter you hear, never see ----------
function segDist(p, w) { // pixel distance from point to wall, + nearest point (normalized)
  const ax = w.x1 * W, ay = w.y1 * H, bx = w.x2 * W, by = w.y2 * H;
  const qx = p.x * W, qy = p.y * H;
  const dx = bx - ax, dy = by - ay;
  const L2 = dx * dx + dy * dy;
  let t = L2 ? ((qx - ax) * dx + (qy - ay) * dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  const nx = ax + dx * t, ny = ay + dy * t;
  return { d: Math.hypot(qx - nx, qy - ny), x: nx / W, y: ny / H };
}
const ccw = (ax, ay, bx, by, cx, cy) => (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
function segsCross(ax, ay, bx, by, cx, cy, dx, dy) {
  const d1 = ccw(ax, ay, bx, by, cx, cy), d2 = ccw(ax, ay, bx, by, dx, dy);
  const d3 = ccw(cx, cy, dx, dy, ax, ay), d4 = ccw(cx, cy, dx, dy, bx, by);
  return d1 * d2 < 0 && d3 * d4 < 0;
}
function occludedBy(a, b) { // is there a wall between two points?
  for (const w of S.walls)
    if (segsCross(a.x, a.y, b.x, b.y, w.x1, w.y1, w.x2, w.y2)) return true;
  return false;
}

// ---------- audio ----------
let AC = null, master = null;
let voice = null, twinVoice = null, growls = [];

function makeVoice(rough) {
  // two detuned oscs -> tremble(only if rough) -> gain -> lowpass -> pan
  const o1 = AC.createOscillator(), o2 = AC.createOscillator();
  o1.type = 'sine'; o2.type = rough ? 'sawtooth' : 'sine';
  o2.detune.value = rough ? 9 : 5;
  const vib = AC.createOscillator(), vibG = AC.createGain();
  vib.frequency.value = rough ? 6.3 : 4.7; vibG.gain.value = 6;
  vib.connect(vibG); vibG.connect(o1.frequency); vibG.connect(o2.frequency);
  const gain = AC.createGain(); gain.gain.value = 0;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800;
  const pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
  o1.connect(gain); o2.connect(gain);
  let trem = null;
  if (rough) { // audible burr: fast amplitude flutter marks the false voice
    trem = AC.createOscillator(); trem.type = 'square'; trem.frequency.value = 26;
    const tg = AC.createGain(); tg.gain.value = 0.45;
    trem.connect(tg); tg.connect(gain.gain); trem.start();
  }
  gain.connect(lp);
  if (pan) { lp.connect(pan); pan.connect(master); } else { lp.connect(master); }
  // shimmer: high partial that opens only when near
  const sh = AC.createOscillator(); sh.type = 'sine';
  const shG = AC.createGain(); shG.gain.value = 0;
  sh.connect(shG); shG.connect(pan || master);
  o1.start(); o2.start(); sh.start(); vib.start();
  return { o1, o2, sh, shG, gain, lp, pan, stopNodes: [o1, o2, sh, vib, trem].filter(Boolean) };
}

function killVoice(v) {
  if (!v) return;
  const t = AC.currentTime;
  v.gain.gain.cancelScheduledValues(t);
  v.gain.gain.setTargetAtTime(0, t, 0.05);
  if (v.shG) v.shG.gain.setTargetAtTime(0, t, 0.05); // growls carry no shimmer
  setTimeout(() => v.stopNodes.forEach(n => { try { n.stop(); } catch (e) {} }), 400);
}

function makeGrowl() {
  // rough low presence: saw + filtered noise, spatialized like the voices
  const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 61;
  const nbuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = nbuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const n = AC.createBufferSource(); n.buffer = nbuf; n.loop = true;
  const nlp = AC.createBiquadFilter(); nlp.type = 'lowpass'; nlp.frequency.value = 240;
  const gain = AC.createGain(); gain.gain.value = 0;
  const pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
  o.connect(gain); n.connect(nlp); nlp.connect(gain);
  if (pan) { gain.connect(pan); pan.connect(master); } else { gain.connect(master); }
  o.start(); n.start();
  return { gain, pan, stopNodes: [o, n] };
}

// pitch from vertical offset: above you = higher. ~1.8 octaves of room.
function pitchFor(rel) { return 235 * Math.pow(2, -rel * 1.8); }

function spatialize(v, pos, dt) {
  const p = S.player, t = AC.currentTime;
  const d = dist(p, pos);
  const reach = Math.hypot(W, H) * 0.72;
  const near = Math.max(0, 1 - d / reach);
  const rel = pos.y - p.y; // + means below player
  // a wall between you is a band of quiet: the voice ducks and goes muffled
  const shade = occludedBy(p, pos) ? 0.3 : 1;
  v.o1.frequency.setTargetAtTime(pitchFor(rel), t, 0.06);
  v.o2.frequency.setTargetAtTime(pitchFor(rel), t, 0.06);
  v.gain.gain.setTargetAtTime((0.045 + near * near * 0.46) * shade, t, 0.12);
  v.lp.frequency.setTargetAtTime(
    shade < 1 ? 360 : 480 + near * near * 5200, t, 0.12);
  if (v.pan) v.pan.pan.setTargetAtTime(
    Math.max(-1, Math.min(1, (pos.x - p.x) * W / (W * 0.45))), t, 0.06);
  // shimmer wakes inside three capture-radii: the "almost there" halo
  const cap = captureR();
  const close = Math.max(0, 1 - d / (cap * 3)) * shade;
  v.sh.frequency.setTargetAtTime(pitchFor(rel) * 3, t, 0.06);
  v.shG.gain.setTargetAtTime(close * close * 0.075 *
    (0.6 + 0.4 * Math.sin(performance.now() / 70)), t, 0.05);
}

function captureR() { return MIN * 0.075; }

function chime(basePitch) {
  const t0 = AC.currentTime;
  [1, 1.25, 1.5, 2].forEach((r, i) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = basePitch * r;
    g.gain.setValueAtTime(0, t0 + i * 0.09);
    g.gain.linearRampToValueAtTime(0.22, t0 + i * 0.09 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.09 + 1.1);
    o.connect(g); g.connect(master);
    o.start(t0 + i * 0.09); o.stop(t0 + i * 0.09 + 1.2);
  });
}

function thud() {
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(120, t0);
  o.frequency.exponentialRampToValueAtTime(38, t0 + 0.25);
  g.gain.setValueAtTime(0.6, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 0.35);
  const nbuf = AC.createBuffer(1, AC.sampleRate * 0.25, AC.sampleRate);
  const d = nbuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const n = AC.createBufferSource(); n.buffer = nbuf;
  const ng = AC.createGain(); ng.gain.value = 0.35;
  n.connect(ng); ng.connect(master); n.start(t0);
}

function crack() { // false twin dissolving: dry, short, unrewarding
  const t0 = AC.currentTime;
  const nbuf = AC.createBuffer(1, AC.sampleRate * 0.12, AC.sampleRate);
  const d = nbuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const n = AC.createBufferSource(); n.buffer = nbuf;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
  const g = AC.createGain(); g.gain.value = 0.3;
  n.connect(hp); hp.connect(g); g.connect(master); n.start(t0);
}

// ---------- sonar: tap once, the room answers ----------
const clampPan = v => Math.max(-1, Math.min(1, v));

function pingClick(t0) { // the outgoing tick: dry, small, yours
  const nbuf = AC.createBuffer(1, AC.sampleRate * 0.03, AC.sampleRate);
  const d = nbuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const n = AC.createBufferSource(); n.buffer = nbuf;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
  const g = AC.createGain(); g.gain.value = 0.22;
  n.connect(hp); hp.connect(g); g.connect(master); n.start(t0);
}

// one returning echo: place decides delay/pan/pitch, kind decides timbre
function scheduleEcho(pos, kind) {
  const p = S.player;
  const norm = dist(p, pos) / Math.hypot(W, H); // 0..~1 across the room
  const t0 = AC.currentTime + 0.13 + norm * 0.85;
  let loud = Math.max(0.06, 1 - norm * 0.85);
  const rel = pos.y - p.y;
  const f = pitchFor(rel);
  const panV = clampPan((pos.x - p.x) * W / (W * 0.45));
  const pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
  let out = pan || master;
  if (pan) { pan.pan.value = panV; pan.connect(master); }

  // an echo that comes back through a wall comes back dulled
  const muff = kind !== 'inwall' && occludedBy(p, pos);
  if (muff) {
    loud *= 0.4;
    const ml = AC.createBiquadFilter(); ml.type = 'lowpass'; ml.frequency.value = 380;
    ml.connect(out); out = ml;
  }

  const o = AC.createOscillator(), g = AC.createGain();
  g.gain.setValueAtTime(0, t0);
  o.connect(g); g.connect(out);

  if (kind === 'wall') { // muffled knock: the room's edge, matter not voice
    o.type = 'sine'; o.frequency.value = f * 0.5;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = 500 + loud * 700;
    g.disconnect(); g.connect(lp); lp.connect(out);
    g.gain.linearRampToValueAtTime(0.11 * loud, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
    o.start(t0); o.stop(t0 + 0.25);
  } else if (kind === 'voice') { // the voice answers in its own pure tone
    o.type = 'sine'; o.frequency.value = f;
    g.gain.linearRampToValueAtTime(0.20 * loud, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
    const sh = AC.createOscillator(), shG = AC.createGain();
    sh.type = 'sine'; sh.frequency.value = f * 3;
    shG.gain.setValueAtTime(0, t0);
    shG.gain.linearRampToValueAtTime(0.035 * loud, t0 + 0.02);
    shG.gain.exponentialRampToValueAtTime(0.001, t0 + 0.45);
    sh.connect(shG); shG.connect(out);
    sh.start(t0); sh.stop(t0 + 0.7);
    o.start(t0); o.stop(t0 + 0.7);
  } else if (kind === 'twin') { // the burr survives even in the echo
    o.type = 'sine'; o.frequency.value = f;
    const trem = AC.createOscillator(), tg = AC.createGain();
    trem.type = 'square'; trem.frequency.value = 26; tg.gain.value = 0.12 * loud;
    trem.connect(tg); tg.connect(g.gain); trem.start(t0); trem.stop(t0 + 0.6);
    g.gain.linearRampToValueAtTime(0.16 * loud, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
    o.start(t0); o.stop(t0 + 0.6);
  } else if (kind === 'inwall') { // interior wall: a dry double knock — wood, not stone
    o.type = 'sine'; o.frequency.value = f * 0.5;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = 700 + loud * 500;
    g.disconnect(); g.connect(lp); lp.connect(out);
    g.gain.linearRampToValueAtTime(0.13 * loud, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
    g.gain.setValueAtTime(0.001, t0 + 0.09);
    g.gain.linearRampToValueAtTime(0.10 * loud, t0 + 0.10);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
    o.start(t0); o.stop(t0 + 0.24);
  } else { // growl: a low rasp answers from the dark
    o.type = 'sawtooth'; o.frequency.value = 61 * 2;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
    g.disconnect(); g.connect(lp); lp.connect(out);
    g.gain.linearRampToValueAtTime(0.17 * loud, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
    o.start(t0); o.stop(t0 + 0.35);
  }
}

function ping(now) {
  if (now - S.lastPing < 1400) return;
  S.lastPing = now; S.pinged = true;
  const p = S.player;
  pingClick(AC.currentTime);
  scheduleEcho({ x: 0.0, y: p.y }, 'wall');
  scheduleEcho({ x: 1.0, y: p.y }, 'wall');
  scheduleEcho({ x: p.x, y: 0.0 }, 'wall');
  scheduleEcho({ x: p.x, y: 1.0 }, 'wall');
  S.walls.forEach(w => {
    const s = segDist(p, w); // the wall answers from its nearest face
    scheduleEcho({ x: s.x, y: s.y }, 'inwall');
    // and glints for one breath, exactly when its knock comes home
    S.wallFlashes.push({ w, at: now + 130 + (s.d / Math.hypot(W, H)) * 850 });
  });
  if (S.target) scheduleEcho(S.target, 'voice');
  if (S.twin) scheduleEcho(S.twin, 'twin');
  S.hazards.forEach(h => scheduleEcho(h, 'growl'));
  S.ripple = { t: 0 };
}

function wallTap() { // matter underhand: a soft dull knock, nothing like a hazard
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(95, t0);
  o.frequency.exponentialRampToValueAtTime(70, t0 + 0.09);
  g.gain.setValueAtTime(0.14, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.11);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 0.13);
}

function footstep() {
  const t0 = AC.currentTime;
  const nbuf = AC.createBuffer(1, AC.sampleRate * 0.05, AC.sampleRate);
  const d = nbuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const n = AC.createBufferSource(); n.buffer = nbuf;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
  const g = AC.createGain(); g.gain.value = 0.10;
  n.connect(lp); lp.connect(g); g.connect(master); n.start(t0);
}

// ---------- rounds ----------
function placeAwayFromPlayer(minFrac) {
  const p = S.player;
  for (let i = 0; i < 60; i++) {
    const c = { x: rnd(0.12, 0.88), y: rnd(0.12, 0.88) };
    if (dist(p, c) > MIN * minFrac) return c;
  }
  return { x: rnd(0.12, 0.88), y: rnd(0.12, 0.88) };
}

// a finite, axis-aligned span of matter — endpoints well off the outer
// walls, so every wall can be walked around
function placeWall() {
  const cap = captureR();
  for (let i = 0; i < 50; i++) {
    const horiz = Math.random() < 0.5;
    const len = rnd(0.26, 0.44);
    const cx = rnd(0.28, 0.72), cy = rnd(0.28, 0.72);
    const w = horiz
      ? { x1: Math.max(0.16, cx - len / 2), y1: cy, x2: Math.min(0.84, cx + len / 2), y2: cy }
      : { x1: cx, y1: Math.max(0.16, cy - len / 2), x2: cx, y2: Math.min(0.84, cy + len / 2) };
    if (segDist(S.player, w).d < MIN * 0.12) continue;
    if (segDist(S.target, w).d < cap * 3) continue;
    if (S.twin && segDist(S.twin, w).d < cap * 2) continue;
    if (S.walls.some(o => segsCross(o.x1, o.y1, o.x2, o.y2, w.x1, w.y1, w.x2, w.y2))) continue;
    return w;
  }
  return null;
}

function startRound() {
  const r = S.round;
  S.target = Object.assign(placeAwayFromPlayer(0.5), { drift: r >= 7 });
  killVoice(voice); voice = makeVoice(false);

  killVoice(twinVoice); twinVoice = null; S.twin = null;
  if (r >= 10) {
    S.twin = placeAwayFromPlayer(0.4);
    twinVoice = makeVoice(true);
  }

  // from round 5 the room grows bones: interior walls, heard not seen
  S.walls = []; S.wallFlashes = [];
  const nWalls = r < 5 ? 0 : r < 9 ? 1 : 2;
  for (let i = 0; i < nWalls; i++) {
    const w = placeWall();
    if (w) S.walls.push(w);
  }

  growls.forEach(killVoice); growls = []; S.hazards = [];
  const nHaz = r < 4 ? 0 : r < 8 ? 1 : r < 12 ? 2 : 3;
  for (let i = 0, tries = 0; i < nHaz && tries < 80; tries++) {
    // roughly on the way to the target, jittered off the line
    const t = rnd(0.4, 0.72);
    const h = {
      x: S.player.x + (S.target.x - S.player.x) * t + rnd(-0.14, 0.14),
      y: S.player.y + (S.target.y - S.player.y) * t + rnd(-0.14, 0.14),
    };
    h.x = Math.min(0.92, Math.max(0.08, h.x));
    h.y = Math.min(0.92, Math.max(0.08, h.y));
    if (dist(h, S.target) < captureR() * 2.5 || dist(h, S.player) < captureR() * 3) continue;
    if (S.walls.some(w => segDist(h, w).d < captureR())) continue; // not inside matter
    S.hazards.push(h);
    growls.push(makeGrowl());
    i++;
  }
}

function catchTarget() {
  const t = px(S.target);
  const rel = S.target.y - S.player.y;
  chime(pitchFor(rel));
  if (navigator.vibrate) navigator.vibrate(35);
  S.stars.push({ x: S.target.x, y: S.target.y, born: performance.now() });
  saveStars();
  S.glow = { x: t.x, y: t.y, t: 0 };
  S.round++;
  document.getElementById('hint').style.opacity = 0;
  startRound();
}

// ---------- input: relative drag = drift ----------
const stick = { on: false, ox: 0, oy: 0, dx: 0, dy: 0, t0: 0, moved: 0 };
const keys = {};
cv.addEventListener('pointerdown', e => {
  stick.on = true; stick.ox = e.clientX; stick.oy = e.clientY;
  stick.dx = stick.dy = stick.moved = 0; stick.t0 = performance.now();
});
cv.addEventListener('pointermove', e => {
  if (!stick.on) return;
  stick.dx = e.clientX - stick.ox; stick.dy = e.clientY - stick.oy;
  stick.moved = Math.max(stick.moved, Math.hypot(stick.dx, stick.dy));
});
cv.addEventListener('pointerup', () => {
  // a still, brief touch is not a drift — it's a question. The room answers.
  if (stick.on && S.started && AC &&
      performance.now() - stick.t0 < 280 && stick.moved < 12) ping(performance.now());
  stick.on = false; stick.dx = stick.dy = 0;
});
cv.addEventListener('pointercancel', () => { stick.on = false; stick.dx = stick.dy = 0; });
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' && S.started && AC) ping(performance.now());
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ---------- start ----------
document.getElementById('veil').addEventListener('pointerdown', () => {
  if (S.started) return;
  S.started = true;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
  AC.resume();
  document.getElementById('veil').classList.add('gone');
  const hint = document.getElementById('hint');
  setTimeout(() => { hint.style.opacity = 0.9; }, 1800);
  setTimeout(() => { hint.style.opacity = 0; }, 9000);
  setTimeout(() => { // second lesson, only if they haven't found it themselves
    if (S.pinged) return;
    hint.textContent = 'tap once, and hold still — the room answers';
    hint.style.opacity = 0.9;
    setTimeout(() => { hint.style.opacity = 0; }, 7000);
  }, 12000);
  startRound();
});
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});

// ---------- loop ----------
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  if (S.started && AC) step(dt, now);
  draw(now);
}
requestAnimationFrame(frame);

function step(dt, now) {
  const p = S.player;

  // intent
  let ix = 0, iy = 0;
  if (stick.on) {
    const len = Math.hypot(stick.dx, stick.dy);
    if (len > 4) {
      const s = Math.min(1, len / 64);
      ix = stick.dx / len * s; iy = stick.dy / len * s;
    }
  }
  if (keys['arrowleft'] || keys['a']) ix -= 1;
  if (keys['arrowright'] || keys['d']) ix += 1;
  if (keys['arrowup'] || keys['w']) iy -= 1;
  if (keys['arrowdown'] || keys['s']) iy += 1;
  const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }

  const speed = 0.28; // screens per second
  if (S.stun > 0) { S.stun -= dt; ix = iy = 0; }
  p.vx += (ix * speed - p.vx) * Math.min(1, dt * 8);
  p.vy += (iy * speed - p.vy) * Math.min(1, dt * 8);
  p.x = Math.min(0.97, Math.max(0.03, p.x + p.vx * dt));
  p.y = Math.min(0.97, Math.max(0.03, p.y + p.vy * dt));

  // interior walls are matter: you stop softly and slide along
  const wallR = MIN * 0.012;
  for (const w of S.walls) {
    const s = segDist(p, w);
    if (s.d < wallR) {
      const nx = (p.x - s.x) * W, ny = (p.y - s.y) * H;
      const nl = Math.hypot(nx, ny) || 1;
      p.x = (s.x * W + nx / nl * wallR) / W;
      p.y = (s.y * H + ny / nl * wallR) / H;
      const vdot = (p.vx * W * nx + p.vy * H * ny) / nl; // px/s into the wall
      if (vdot < 0) {
        p.vx -= vdot * (nx / nl) / W;
        p.vy -= vdot * (ny / nl) / H;
        if (now - S.lastWallHit > 380 && -vdot > MIN * 0.09) {
          wallTap(); S.lastWallHit = now;
        }
      }
    }
  }

  // footsteps while drifting
  if (Math.hypot(p.vx, p.vy) > 0.06 && now - S.lastStep > 300) {
    footstep(); S.lastStep = now;
  }

  // target drift (later rounds): slow wander
  if (S.target && S.target.drift) {
    S.target.x += Math.sin(now / 3100) * 0.028 * dt;
    S.target.y += Math.cos(now / 4300) * 0.028 * dt;
    S.target.x = Math.min(0.9, Math.max(0.1, S.target.x));
    S.target.y = Math.min(0.9, Math.max(0.1, S.target.y));
    for (const w of S.walls) { // a drifting voice shies away from matter
      const s = segDist(S.target, w);
      if (s.d < captureR() * 1.6) {
        const ax = S.target.x - s.x, ay = S.target.y - s.y;
        const al = Math.hypot(ax, ay) || 1;
        S.target.x += ax / al * 0.05 * dt;
        S.target.y += ay / al * 0.05 * dt;
      }
    }
  }

  // sound the world
  if (voice && S.target) spatialize(voice, S.target, dt);
  if (twinVoice && S.twin) spatialize(twinVoice, S.twin, dt);
  S.hazards.forEach((h, i) => {
    const v = growls[i]; if (!v) return;
    const d = dist(p, h);
    const reach = Math.hypot(W, H) * 0.45;
    const near = Math.max(0, 1 - d / reach);
    const shade = occludedBy(p, h) ? 0.3 : 1;
    const t = AC.currentTime;
    v.gain.gain.setTargetAtTime(near * near * 0.5 * shade, t, 0.09);
    if (v.pan) v.pan.pan.setTargetAtTime(
      Math.max(-1, Math.min(1, (h.x - p.x) * W / (W * 0.45))), t, 0.06);
  });

  // collisions
  const cap = captureR();
  if (S.twin && dist(p, S.twin) < cap) {
    crack();
    killVoice(twinVoice); twinVoice = null; S.twin = null; // the burr was never real
  }
  if (S.target && dist(p, S.target) < cap) { catchTarget(); return; }
  for (const h of S.hazards) {
    if (dist(p, h) < cap * 0.9 && S.stun <= 0) {
      thud();
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      const ang = Math.atan2(p.y - h.y, p.x - h.x);
      p.vx = Math.cos(ang) * 0.5; p.vy = Math.sin(ang) * 0.5;
      S.stun = 0.45;
    }
  }
}

// ---------- draw: almost nothing, on purpose ----------
function draw(now) {
  g2.fillStyle = '#000';
  g2.fillRect(0, 0, W, H);

  // the constellation of everywhere you've heard
  for (const s of S.stars) {
    const age = (now - s.born) / 1000;
    const a = Math.min(0.16, 0.5 / (1 + age * 0.6)) + 0.05;
    g2.fillStyle = `rgba(235,230,215,${a.toFixed(3)})`;
    const q = px(s);
    g2.fillRect(q.x - 1, q.y - 1, 2, 2);
  }

  // catch ripple: one breath of light where the sound was
  if (S.glow) {
    S.glow.t += 1 / 60;
    const r = S.glow.t * MIN * 0.5;
    const a = Math.max(0, 0.25 - S.glow.t * 0.35);
    if (a <= 0) S.glow = null;
    else {
      g2.strokeStyle = `rgba(235,230,215,${a.toFixed(3)})`;
      g2.lineWidth = 1;
      g2.beginPath(); g2.arc(S.glow.x, S.glow.y, r, 0, Math.PI * 2); g2.stroke();
    }
  }

  // walls glint only when their knock comes home: matter, lit briefly by sound
  if (S.wallFlashes.length) {
    S.wallFlashes = S.wallFlashes.filter(f => now < f.at + 900);
    for (const f of S.wallFlashes) {
      if (now < f.at) continue;
      const a = 0.08 * (1 - (now - f.at) / 900);
      g2.strokeStyle = `rgba(235,230,215,${a.toFixed(3)})`;
      g2.lineWidth = 1;
      g2.beginPath();
      g2.moveTo(f.w.x1 * W, f.w.y1 * H);
      g2.lineTo(f.w.x2 * W, f.w.y2 * H);
      g2.stroke();
    }
  }

  // ping ripple: the question you asked, leaving you
  if (S.ripple) {
    S.ripple.t += 1 / 60;
    const r = S.ripple.t * MIN * 0.9;
    const a = Math.max(0, 0.09 - S.ripple.t * 0.09);
    if (a <= 0) S.ripple = null;
    else {
      const q = px(S.player);
      g2.strokeStyle = `rgba(235,230,215,${a.toFixed(3)})`;
      g2.lineWidth = 1;
      g2.beginPath(); g2.arc(q.x, q.y, r, 0, Math.PI * 2); g2.stroke();
    }
  }

  // you: a breath-dim point, just enough to know you exist
  if (S.started) {
    const q = px(S.player);
    const breathe = 0.05 + 0.02 * Math.sin(now / 900);
    g2.fillStyle = `rgba(235,230,215,${breathe.toFixed(3)})`;
    g2.beginPath(); g2.arc(q.x, q.y, 2.5, 0, Math.PI * 2); g2.fill();
  }
}
</script>
