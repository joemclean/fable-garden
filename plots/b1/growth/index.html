<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Didn't You Notice</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0d16; color: #cfd3e0;
    font-family: Georgia, 'Times New Roman', serif;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: block; }
  #veil {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: #0a0d16; z-index: 10; padding: 2em; box-sizing: border-box;
    transition: opacity 1.2s ease;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  #veil h1 { font-weight: normal; font-size: 1.7em; letter-spacing: .06em; margin: 0 0 .9em; color: #e8eaf2; }
  #veil p { font-size: 1em; line-height: 1.7; max-width: 22em; margin: .2em 0; color: #9aa0b4; font-style: italic; }
  #veil .go { margin-top: 2.2em; font-style: normal; color: #cfd3e0; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center; padding: .9em 1em 0;
    font-size: .85em; color: #6d7388; letter-spacing: .08em; font-style: italic;
    pointer-events: none;
  }
  #say {
    position: fixed; left: 0; right: 0; bottom: 14%; z-index: 5;
    text-align: center; font-style: italic; font-size: 1.02em; color: #b9bfd2;
    pointer-events: none; opacity: 0; transition: opacity .6s ease;
    padding: 0 2em; text-shadow: 0 1px 8px #0a0d16;
  }
  #say.on { opacity: 1; }
  #home {
    position: fixed; bottom: .9em; left: 0; right: 0; z-index: 9;
    text-align: center; font-size: .8em;
  }
  #home a { color: #565c72; text-decoration: none; font-style: italic; letter-spacing: .08em; }
  #home a:hover { color: #9aa0b4; }
  #coda {
    position: fixed; inset: 0; z-index: 8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2em; box-sizing: border-box;
    background: rgba(10,13,22,0.72);
    opacity: 0; pointer-events: none; transition: opacity 1.4s ease;
  }
  #coda.on { opacity: 1; pointer-events: auto; }
  #coda p { font-style: italic; line-height: 1.8; max-width: 22em; margin: .3em 0; color: #b9bfd2; font-size: 1.05em; }
  #coda p.dim { color: #6d7388; font-size: .92em; }
  #coda p.go { margin-top: 2.4em; font-size: .9em; color: #9aa0b4; animation: breathe 3s ease-in-out infinite; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud"><span id="tally"></span></div>
<div id="say"></div>
<div id="veil">
  <h1>Didn&rsquo;t You Notice</h1>
  <p>the world blinks. between the blinks, one thing changes.</p>
  <p>touch the thing that changed.</p>
  <p style="margin-top:1.4em; font-size:.85em;">sound on &mdash; the blink has a voice, and sometimes the change is only a sound.</p>
  <p class="go">touch to look</p>
</div>
<div id="home"><a href="../../../viewer/">&larr; the rest of the garden</a></div>
<div id="coda">
  <p id="coda1"></p>
  <p id="coda2"></p>
  <p class="dim" id="coda3"></p>
  <p class="go">touch to keep looking</p>
</div>

<script>
'use strict';
const TAU = Math.PI * 2;
const cv = document.getElementById('stage');
const cx = cv.getContext('2d');
const veil = document.getElementById('veil');
const sayEl = document.getElementById('say');
const tallyEl = document.getElementById('tally');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- audio ---------- */
let ac = null, master = null, humBus = null, noiseBuf = null;
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  humBus = ac.createGain(); humBus.gain.value = 0.55; humBus.connect(master);
  const len = ac.sampleRate * 0.3;
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}
function blinkNoise() {
  if (!ac) return;
  const t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
  bp.frequency.setValueAtTime(900, t);
  bp.frequency.exponentialRampToValueAtTime(250, t + 0.16);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.2);
}
function chime() {
  if (!ac) return;
  const t = ac.currentTime;
  [660, 990].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t + i * 0.09);
    g.gain.exponentialRampToValueAtTime(0.18, t + i * 0.09 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.5);
    o.connect(g); g.connect(master);
    o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.55);
  });
}
function thud() {
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 0.12);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.2);
}
function duckHum(down) {
  if (!ac) return;
  humBus.gain.setTargetAtTime(down ? 0.06 : 0.55, ac.currentTime, 0.03);
}

/* the scene hums: pitch from height, pan from breadth */
const SCALE = [1, 9/8, 5/4, 3/2, 5/3].flatMap(r => [160 * r, 320 * r]).sort((a, b) => a - b);
function freqForY(yn) { return SCALE[Math.max(0, Math.min(9, Math.floor((1 - yn) * 10)))]; }
const WAVE = { circle: 'sine', ring: 'sine', triangle: 'triangle', diamond: 'triangle', square: 'square', star: 'sawtooth' };
const WVOL = { sine: 0.06, triangle: 0.05, square: 0.02, sawtooth: 0.022 };

let voices = {}; // id -> {osc, gain, pan}
function clearVoices() {
  for (const id in voices) {
    try { voices[id].osc.stop(); } catch (e) {}
    voices[id].gain.disconnect();
  }
  voices = {};
}
function voiceFor(o) {
  if (!ac || voices[o.id]) return;
  const osc = ac.createOscillator();
  osc.type = WAVE[o.shape];
  osc.frequency.value = o.freq;
  const g = ac.createGain(); g.gain.value = 0;
  const p = (ac.createStereoPanner ? ac.createStereoPanner() : null);
  osc.connect(g);
  if (p) { p.pan.value = o.xn * 2 - 1; g.connect(p); p.connect(humBus); }
  else g.connect(humBus);
  osc.start();
  voices[o.id] = { osc, gain: g, pan: p };
}
function tuneToFrame(frame) {
  if (!ac) return;
  const t = ac.currentTime;
  const present = {};
  for (const o of frame) {
    present[o.id] = true;
    voiceFor(o);
    const v = voices[o.id];
    v.osc.frequency.setTargetAtTime(o.freq, t, 0.02);
    v.gain.gain.setTargetAtTime(o.mute ? 0 : WVOL[WAVE[o.shape]], t, 0.03);
    if (v.pan) v.pan.pan.setTargetAtTime(o.xn * 2 - 1, t, 0.03);
  }
  for (const id in voices) if (!present[id]) voices[id].gain.gain.setTargetAtTime(0, t, 0.03);
}

/* ---------- scene ---------- */
const HUES = [32, 340, 175, 265, 95, 205];
const SHAPES = ['circle', 'square', 'triangle', 'diamond', 'star', 'ring'];
let nextId = 1;
function makeObject(existing) {
  for (let tries = 0; tries < 60; tries++) {
    const xn = 0.12 + Math.random() * 0.76;
    const yn = 0.16 + Math.random() * 0.64;
    const r = 20 + Math.random() * 16;
    let ok = true;
    for (const o of existing) {
      const dx = (xn - o.xn) * W, dy = (yn - o.yn) * H;
      if (Math.hypot(dx, dy) < (r + o.r) * 1.9) { ok = false; break; }
    }
    if (!ok) continue;
    return {
      id: nextId++, xn, yn, r,
      shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
      hue: HUES[Math.floor(Math.random() * HUES.length)],
      freq: freqForY(yn), mute: false,
    };
  }
  return null;
}
function makeStars() {
  const s = [];
  for (let i = 0; i < 42; i++) s.push({ x: Math.random(), y: Math.random(), a: 0.04 + Math.random() * 0.09 });
  return s;
}

/* ---------- rounds ---------- */
const game = {
  state: 'veil', // veil | cue | flicker | reveal
  round: 0, found: 0, streak: 0,
  frames: null, changed: null, changeType: null,
  frame: 0, sub: 'show', until: 0, flips: 0, misses: 0,
  marks: [], stars: makeStars(), cueText: '', revealAt: 0,
  showDur: 800, lastTap: null, decoy: null, gazeBiased: false,
  totalChanges: 0,
};
const CODA_EVERY = 12;

function pickChangeType() {
  const r = game.round;
  if (r < 2) return Math.random() < 0.5 ? 'vanish' : 'appear';
  if (r >= 5 && r % 4 === 1) return 'retune';
  const pool = ['vanish', 'appear', 'move', 'color', 'color', 'size', 'move'];
  return pool[Math.floor(Math.random() * pool.length)];
}

function newRound() {
  clearVoices();
  const n = Math.min(5 + game.round, 12);
  const A = [];
  for (let i = 0; i < n; i++) { const o = makeObject(A); if (o) A.push(o); }
  const B = A.map(o => Object.assign({}, o));
  let type = pickChangeType();
  let appeared = null;
  if (type === 'appear') {
    appeared = makeObject(A);
    if (!appeared) type = 'vanish'; /* crowded sky: take one instead */
  }
  const lvl = game.round;
  let target;
  game.decoy = null; game.gazeBiased = false;
  if (type === 'appear') {
    target = appeared;
    B.push(target);
  } else {
    let i = Math.floor(Math.random() * B.length);
    if (type !== 'retune' && game.round >= 4 && game.lastTap && Math.random() < 0.5) {
      /* change the thing they were just looking at */
      let best = 0, bd = Infinity;
      for (let k = 0; k < B.length; k++) {
        const d = Math.hypot((B[k].xn - game.lastTap.xn) * W, (B[k].yn - game.lastTap.yn) * H);
        if (d < bd) { bd = d; best = k; }
      }
      if (bd < Math.min(W, H) * 0.3) { i = best; game.gazeBiased = true; }
    }
    target = B[i];
    if (type === 'vanish') B.splice(i, 1);
    else if (type === 'move') {
      const d = Math.max(120 - lvl * 8, 40) / Math.min(W, H);
      const ang = Math.random() * TAU;
      target.xn = Math.max(0.1, Math.min(0.9, target.xn + Math.cos(ang) * d));
      target.yn = Math.max(0.14, Math.min(0.82, target.yn + Math.sin(ang) * d));
      target.freq = freqForY(target.yn);
    } else if (type === 'color') {
      target.hue = (target.hue + Math.max(110 - lvl * 7, 40)) % 360;
    } else if (type === 'size') {
      /* growing draws the eye; shrinking is meaner — half and half */
      target.r *= Math.random() < 0.5 ? (lvl < 6 ? 1.65 : 1.35) : (lvl < 6 ? 0.55 : 0.7);
    } else if (type === 'retune') {
      target.freq *= (Math.random() < 0.5 ? 1.414 : 0); /* a tritone off the scale, or silence */
      if (target.freq === 0) { target.freq = A.find(o => o.id === target.id).freq; target.mute = true; }
    }
  }
  /* twin decoy: the target's double, unchanged, to hold the eye */
  if (game.round >= 3 && ['vanish', 'move', 'color', 'size'].includes(type) && Math.random() < 0.55) {
    const orig = A.find(o => o.id === target.id) || target;
    const twin = makeObject(A.concat(B));
    if (twin) {
      twin.shape = orig.shape; twin.hue = orig.hue; twin.r = orig.r;
      A.push(twin); B.push(Object.assign({}, twin));
      game.decoy = twin;
    }
  }
  game.frames = [A, B];
  game.changed = { type, a: A.find(o => o.id === target.id) || null, b: target };
  game.changeType = type;
  game.frame = 0; game.flips = 0; game.misses = 0; game.marks = [];
  game.stars = makeStars();
  if (type === 'retune') {
    game.state = 'cue';
    game.cueText = 'nothing will look different this time. listen.';
    game.until = performance.now() + 2200;
    say(game.cueText);
    tuneToFrame([]);
  } else {
    startFlicker();
  }
  tally();
}
function startFlicker() {
  game.state = 'flicker';
  game.sub = 'show'; game.frame = 0;
  game.until = performance.now() + phaseDur();
  tuneToFrame(game.frames[0]);
  say('');
}
function phaseDur() { return game.showDur; }
const MASK = 170;

const HIT_REMARKS = ['caught it.', 'there it is.', 'you saw it. this time.', 'sharp eyes. or ears.'];
const MISS_REMARKS = [
  n => `it changed ${n} times, in plain sight.`,
  n => `${n} changes went by. the world only feels fully seen.`,
  n => `right there, ${n} times over.`,
];
const MISS_DECOY = n => `it changed ${n} times — its twin held your eye.`;
const MISS_GAZE = n => `${n} times, right where you were looking.`;
function endRound(hit) {
  game.state = 'reveal';
  game.revealAt = performance.now();
  game.sub = 'show';
  game.until = performance.now() + 900;
  duckHum(false);
  if (hit) {
    game.found++; game.streak++;
    chime();
    if (game.streak >= 2) game.showDur = Math.max(520, game.showDur - 90);
    say(game.decoy ? 'the twin didn’t fool you.' :
        HIT_REMARKS[Math.floor(Math.random() * HIT_REMARKS.length)]);
  } else {
    game.streak = 0;
    game.showDur = Math.min(900, game.showDur + 140);
    say(game.gazeBiased ? MISS_GAZE(game.flips) :
        game.decoy ? MISS_DECOY(game.flips) :
        MISS_REMARKS[Math.floor(Math.random() * MISS_REMARKS.length)](game.flips));
  }
  game.round++;
  game.totalChanges += game.flips;
  tally();
  setTimeout(() => {
    if (game.round > 0 && game.round % CODA_EVERY === 0) startCoda();
    else newRound();
  }, 3600);
}
function codaChord() {
  if (!ac) return;
  const t = ac.currentTime;
  [396, 330, 264].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t + i * 0.5);
    g.gain.exponentialRampToValueAtTime(0.09, t + i * 0.5 + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.5 + 3.2);
    o.connect(g); g.connect(master);
    o.start(t + i * 0.5); o.stop(t + i * 0.5 + 3.4);
  });
}
function startCoda() {
  game.state = 'coda';
  clearVoices();
  say('');
  codaChord();
  const skies = game.round, seen = game.found, all = game.totalChanges;
  document.getElementById('coda1').textContent =
    `${skies} skies. you noticed ${seen}.`;
  document.getElementById('coda2').textContent = all > 0 ?
    `the world changed ${all} times while you watched.` :
    'you caught each one before it could repeat.';
  document.getElementById('coda3').textContent =
    all === 0 ? 'that never happens. are you sure you’re a pair of eyes?' :
    seen >= skies * 0.7 ? 'sharp, for a pair of eyes. the rest slid by anyway.' :
    'most of it slid by. it always does — it just usually goes unnoticed.';
  document.getElementById('coda').classList.add('on');
  tally();
}
function tally() {
  tallyEl.textContent = game.round === 0 && game.found === 0 ? '' :
    `noticed ${game.found}` + (game.streak > 1 ? ` · ${game.streak} in a row` : '');
}
function say(t) {
  if (!t) { sayEl.classList.remove('on'); return; }
  sayEl.textContent = t;
  sayEl.classList.add('on');
}

/* ---------- input ---------- */
function targetPoints() {
  const pts = [];
  const c = game.changed;
  if (c.a) pts.push({ x: c.a.xn * W, y: c.a.yn * H, r: c.a.r });
  if (c.b && (!c.a || c.b.xn !== c.a.xn || c.b.yn !== c.a.yn)) pts.push({ x: c.b.xn * W, y: c.b.yn * H, r: c.b.r });
  return pts;
}
window.addEventListener('pointerdown', (e) => {
  if (game.state === 'veil') {
    initAudio();
    if (ac.state === 'suspended') ac.resume();
    veil.classList.add('gone');
    setTimeout(newRound, 600);
    game.state = 'starting';
    return;
  }
  if (game.state === 'coda') {
    if (e.clientY > H * 0.92) return; /* the way home stays a way home */
    document.getElementById('coda').classList.remove('on');
    game.state = 'starting';
    setTimeout(newRound, 700);
    return;
  }
  if (game.state !== 'flicker' || game.sub !== 'show') return;
  const x = e.clientX, y = e.clientY;
  if (y > H * 0.92) return; /* the way home stays a way home */
  game.lastTap = { xn: x / W, yn: y / H };
  let hit = false;
  for (const p of targetPoints()) {
    if (Math.hypot(x - p.x, y - p.y) < Math.max(p.r * 1.6, 48)) { hit = true; break; }
  }
  if (hit) { endRound(true); }
  else {
    game.misses++;
    thud();
    game.marks.push({ x, y, at: performance.now() });
    if (game.misses >= 3) endRound(false);
  }
});

/* ---------- drawing ---------- */
function drawShape(o, ghost) {
  const x = o.xn * W, y = o.yn * H, r = o.r * Math.min(W, 460) / 420;
  cx.save();
  cx.translate(x, y);
  const col = `hsl(${o.hue} 75% 62%)`;
  cx.fillStyle = col; cx.strokeStyle = col;
  cx.shadowColor = col; cx.shadowBlur = ghost ? 4 : 16;
  cx.globalAlpha = ghost ? 0.35 : 0.92;
  cx.beginPath();
  switch (o.shape) {
    case 'circle': cx.arc(0, 0, r, 0, TAU); cx.fill(); break;
    case 'ring': cx.lineWidth = r * 0.32; cx.arc(0, 0, r * 0.82, 0, TAU); cx.stroke(); break;
    case 'square': {
      const s = r * 1.62;
      cx.roundRect ? cx.roundRect(-s / 2, -s / 2, s, s, r * 0.22) : cx.rect(-s / 2, -s / 2, s, s);
      cx.fill(); break;
    }
    case 'triangle':
      cx.moveTo(0, -r); cx.lineTo(r * 0.9, r * 0.7); cx.lineTo(-r * 0.9, r * 0.7);
      cx.closePath(); cx.fill(); break;
    case 'diamond':
      cx.moveTo(0, -r * 1.1); cx.lineTo(r * 0.75, 0); cx.lineTo(0, r * 1.1); cx.lineTo(-r * 0.75, 0);
      cx.closePath(); cx.fill(); break;
    case 'star': {
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? r * 0.45 : r;
        const a = -Math.PI / 2 + i * Math.PI / 5;
        i ? cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : cx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      cx.closePath(); cx.fill(); break;
    }
  }
  cx.restore();
}
function drawBackground() {
  cx.fillStyle = '#0a0d16';
  cx.fillRect(0, 0, W, H);
  cx.save();
  for (const s of game.stars) {
    cx.globalAlpha = s.a;
    cx.fillStyle = '#cfd3e0';
    cx.fillRect(s.x * W, s.y * H, 1.4, 1.4);
  }
  cx.restore();
}

function tick(now) {
  requestAnimationFrame(tick);
  drawBackground();
  const st = game.state;

  if (st === 'cue') {
    if (now > game.until) startFlicker();
    return;
  }

  if (st === 'flicker') {
    if (now > game.until) {
      if (game.sub === 'show') {
        game.sub = 'mask';
        game.until = now + MASK;
        blinkNoise();
        duckHum(true);
        tuneToFrame(game.frames[game.frame ^ 1]); /* the change slips in under the noise */
      } else {
        game.sub = 'show';
        game.frame ^= 1;
        game.flips++;
        game.until = now + phaseDur();
        duckHum(false);
      }
    }
    if (game.sub === 'show') {
      for (const o of game.frames[game.frame]) drawShape(o, false);
      if (game.changeType === 'retune' && game.flips > 10) {
        /* mercy: after ten unheard changes, the note's shape shimmers */
        const b = game.changed.b;
        cx.save();
        cx.globalAlpha = 0.04 + 0.05 * (1 + Math.sin(now / 260)) / 2;
        cx.strokeStyle = '#e8eaf2';
        cx.lineWidth = 1.2;
        cx.beginPath();
        cx.arc(b.xn * W, b.yn * H, Math.max(b.r * 1.9, 50), 0, TAU);
        cx.stroke();
        cx.restore();
      }
    } else {
      cx.fillStyle = 'rgba(207,211,224,0.05)';
      cx.fillRect(0, 0, W, H);
    }
    for (const m of game.marks) {
      const age = (now - m.at) / 900;
      if (age > 1) continue;
      cx.save();
      cx.globalAlpha = 0.5 * (1 - age);
      cx.strokeStyle = '#9aa0b4'; cx.lineWidth = 1.5;
      const s = 9;
      cx.beginPath();
      cx.moveTo(m.x - s, m.y - s); cx.lineTo(m.x + s, m.y + s);
      cx.moveTo(m.x + s, m.y - s); cx.lineTo(m.x - s, m.y + s);
      cx.stroke();
      cx.restore();
    }
    return;
  }

  if (st === 'reveal') {
    /* slow alternation, the change held up to the light */
    if (now > game.until) {
      game.frame ^= 1;
      game.until = now + 900;
      tuneToFrame(game.frames[game.frame]);
    }
    for (const o of game.frames[game.frame]) drawShape(o, false);
    for (const p of targetPoints()) {
      const pulse = 1 + 0.12 * Math.sin((now - game.revealAt) / 180);
      cx.save();
      cx.strokeStyle = '#e8eaf2';
      cx.globalAlpha = 0.75;
      cx.lineWidth = 1.6;
      cx.setLineDash([5, 6]);
      cx.beginPath();
      cx.arc(p.x, p.y, Math.max(p.r * 1.7, 44) * pulse, 0, TAU);
      cx.stroke();
      cx.restore();
    }
    return;
  }
}
requestAnimationFrame(tick);
</script>
</body>
</html>
